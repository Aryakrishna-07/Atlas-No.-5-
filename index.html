<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capitals — A Small Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B3A34;
    --paper: #F4EFE3;
    --paper-dark: #E9E1CC;
    --gold: #B8862E;
    --line: #C9BFA3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-dark);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(27,58,52,0.08) 1px, transparent 0);
    background-size: 22px 22px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 48px 44px 40px;
    position: relative;
    box-shadow: 8px 8px 0 rgba(27,58,52,0.12);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--line);
    border-radius: 2px;
    pointer-events: none;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 8px;
    line-height: 1.15;
  }

  p.lead {
    margin: 0 0 32px;
    font-size: 14.5px;
    color: rgba(27,58,52,0.72);
    max-width: 40ch;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 8px;
    color: rgba(27,58,52,0.85);
  }

  .select-wrap {
    position: relative;
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    padding: 10px 32px 10px 2px;
    cursor: pointer;
  }

  select:focus {
    outline: none;
    border-bottom-color: var(--gold);
  }

  .select-wrap::after {
    content: "";
    position: absolute;
    right: 4px;
    top: 50%;
    width: 9px;
    height: 9px;
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .result {
    margin-top: 34px;
    padding-top: 26px;
    border-top: 1px dashed var(--line);
    display: flex;
    align-items: baseline;
    gap: 14px;
    min-height: 54px;
  }

  .result .tag {
    font-size: 12.5px;
    color: rgba(27,58,52,0.55);
    white-space: nowrap;
  }

  #capital {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--gold);
    transition: opacity 0.25s ease;
  }

  #capital.empty {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 14.5px;
    color: rgba(27,58,52,0.4);
  }

  .stamp {
    position: absolute;
    top: 34px;
    right: 40px;
    width: 62px;
    height: 62px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(8deg);
    opacity: 0.85;
  }

  .stamp span {
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-align: center;
    font-weight: 600;
    line-height: 1.3;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="stamp"><span>ATLAS<br>No. 5</span></div>
    <p class="eyebrow">A SMALL ATLAS</p>
    <h1>Where does it lead?</h1>
    <p class="lead">Pick a country below and its capital city will appear beneath the line.</p>

    <label for="country">Country</label>
    <div class="select-wrap">
      <select id="country" onchange="showCapital()">
        <option value="" disabled selected>Choose a country…</option>
        <option value="Tokyo">Japan</option>
        <option value="Paris">France</option>
        <option value="Cairo">Egypt</option>
        <option value="Canberra">Australia</option>
        <option value="Ottawa">Canada</option>
        <option value="Berlin">Germany</option>
        <option value="Rome">Italy</option>
        <option value="Madrid">Spain</option>
        <option value="Lisbon">Portugal</option>
        <option value="Athens">Greece</option>
        <option value="Moscow">Russia</option>
        <option value="Beijing">China</option>
        <option value="New Delhi">India</option>
        <option value="Seoul">South Korea</option>
        <option value="Bangkok">Thailand</option>
        <option value="Jakarta">Indonesia</option>
        <option value="Nairobi">Kenya</option>
        <option value="Pretoria">South Africa</option>
        <option value="Brasília">Brazil</option>
        <option value="Buenos Aires">Argentina</option>
        <option value="Mexico City">Mexico</option>
        <option value="Washington, D.C.">United States</option>
        <option value="London">United Kingdom</option>
        <option value="Dublin">Ireland</option>
        <option value="Oslo">Norway</option>
        <option value="Stockholm">Sweden</option>
        <option value="Helsinki">Finland</option>
        <option value="Wellington">New Zealand</option>
        <option value="Ankara">Turkey</option>
        <option value="Riyadh">Saudi Arabia</option>
      </select>
    </div>

    <div class="result">
      <span class="tag">Capital city</span>
      <span id="capital" class="empty">—</span>
    </div>
  </div>

<script>
  function showCapital() {
    const select = document.getElementById('country');
    const capitalEl = document.getElementById('capital');
    const value = select.value;
    capitalEl.textContent = value;
    capitalEl.classList.remove('empty');
    capitalEl.style.opacity = 0;
    requestAnimationFrame(() => { capitalEl.style.opacity = 1; });
  }
</script>

</body>
</html>
